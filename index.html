<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casamiento Thom & Mart</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vino: '#722F37',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #722F37;
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }
    </style>
</head>
<body class="bg-vino text-white font-sans antialiased">

    <!-- Hero Section con foto de fondo y overlay oscuro -->
    <header class="relative h-screen flex flex-col items-center justify-center text-center px-4 overflow-hidden">
        <!-- Imagen de fondo de Google Drive adaptada para enlace directo -->
        <div class="absolute inset-0 bg-cover bg-center z-0 filter brightness-50" style="background-image: url('https://lh3.googleusercontent.com/d/1EzgB8kYpqWTUFGMjVXKtzBr8IuK1rN4P=w1920');"></div>
        <div class="absolute inset-0 bg-black/40 z-0"></div>

        <div class="relative z-10 text-white mt-20">
            <p class="uppercase tracking-[0.3em] text-sm md:text-base mb-6 font-medium text-white">¡Nos casamos!</p>
            <h1 class="font-serif text-5xl md:text-7xl lg:text-8xl mb-6 italic whitespace-nowrap">Thom <span class="text-4xl md:text-5xl lg:text-6xl text-white mx-2">&</span> Mart</h1>
            <div class="w-24 h-[1px] bg-white mx-auto mb-8"></div>
            <button onclick="openRsvpModal()" class="bg-white/20 hover:bg-white hover:text-vino text-white font-medium py-3 px-10 rounded-full transition-colors duration-300 border border-white/30 uppercase tracking-widest text-sm shadow-lg backdrop-blur-sm">RSVP</button>
        </div>
    </header>

    <!-- Sección de Detalles del Evento -->
    <section class="py-16 px-6 border-t border-vino/20 text-center bg-white">
        <div class="max-w-5xl mx-auto">
            <h2 class="font-serif text-3xl md:text-4xl mb-8 italic text-vino">Faltan...</h2>
            
            <div id="countdown" class="flex justify-center gap-6 md:gap-12 mb-16 font-sans">
                <div class="flex flex-col items-center"><span id="days" class="font-serif text-4xl md:text-6xl text-vino">00</span><span class="text-xs md:text-sm uppercase tracking-widest mt-2 text-vino">Días</span></div>
                <div class="flex flex-col items-center"><span id="hours" class="font-serif text-4xl md:text-6xl text-vino">00</span><span class="text-xs md:text-sm uppercase tracking-widest mt-2 text-vino">Hs</span></div>
                <div class="flex flex-col items-center"><span id="minutes" class="font-serif text-4xl md:text-6xl text-vino">00</span><span class="text-xs md:text-sm uppercase tracking-widest mt-2 text-vino">Min</span></div>
                <div class="flex flex-col items-center"><span id="seconds" class="font-serif text-4xl md:text-6xl text-vino">00</span><span class="text-xs md:text-sm uppercase tracking-widest mt-2 text-vino">Seg</span></div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-10 text-center border-t border-vino/20 pt-16">
                <!-- Dónde -->
                <div class="flex flex-col items-center">
                    <div class="w-14 h-14 rounded-full bg-vino/10 flex items-center justify-center mb-4">
                        <svg class="w-6 h-6 text-vino" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                    <h3 class="font-serif text-2xl mb-2 text-vino">Dónde</h3>
                    <p class="font-light text-lg mb-4 text-vino/90">Estancia Santa Lucía</p>
                    <a href="https://www.google.com/maps/dir//Santa+Luc%C3%ADa+-+Eventos+Corporativos+y+Sociales,+KM+170,+RP6,+B6708+Pilar,+Provincia+de+Buenos+Aires/@-34.4189009,-58.8404163,14z/data=!4m8!4m7!1m0!1m5!1m1!1s0x95bb7e2ff2653dd9:0x802555d9783c01b2!2m2!1d-59.0468113!2d-34.4378675?entry=ttu&g_ep=EgoyMDI2MTAyMC4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="inline-block bg-vino/10 hover:bg-vino hover:text-white text-vino font-medium py-2 px-5 rounded-full transition-colors duration-300 border border-vino/30 text-sm">
                        Cómo llegar
                    </a>
                </div>
                <!-- Cuándo -->
                <div class="flex flex-col items-center">
                    <div class="w-14 h-14 rounded-full bg-vino/10 flex items-center justify-center mb-4">
                        <svg class="w-6 h-6 text-vino" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h3 class="font-serif text-2xl mb-2 text-vino">Cuándo</h3>
                    <p class="font-light text-lg text-vino/90">Viernes 29 de enero de 2027<br>Ceremonia: 18.30 hs</p>
                </div>
                <!-- Dress Code -->
                <div class="flex flex-col items-center">
                    <div class="w-14 h-14 rounded-full bg-vino/10 flex items-center justify-center mb-4">
                        <svg class="w-6 h-6 text-vino" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <h3 class="font-serif text-2xl mb-2 text-vino">Dress Code</h3>
                    <p class="font-light text-lg mb-4 text-vino/90">Formal / Elegante</p>
                    <a href="https://pin.it/6zADEBrw7" target="_blank" class="inline-block bg-vino/10 hover:bg-vino hover:text-white text-vino font-medium py-2 px-5 rounded-full transition-colors duration-300 border border-vino/30 text-sm">
                        Ver referencias
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Sección de Regalos -->
    <section class="py-20 px-6 border-t border-white/20 bg-vino" id="regalos">
        <div class="max-w-6xl mx-auto text-center">
            <h2 class="font-serif text-4xl md:text-5xl mb-6 text-white">Lista de Regalos</h2>
            <p class="text-lg md:text-
